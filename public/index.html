<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Блог с магазином подарков</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }
        
        /* Боковая панель */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .panel {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Авторизация */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        /* Пользователь */
        .user-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        .user-details h3 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .user-badge {
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        
        .user-badge.admin {
            background: #ff4757;
        }
        
        .balance {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #333;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
        }
        
        /* Навигация */
        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .nav-btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #f8f9ff;
            color: #333;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
            width: 100%;
            text-align: left;
        }
        
        .nav-btn:hover {
            background: #667eea;
            color: white;
            transform: translateX(5px);
        }
        
        .nav-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        /* Основной контент */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .content-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: none;
            min-height: 500px;
        }
        
        .content-section.active {
            display: block;
        }
        
        /* Кнопки */
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff4757 0%, #ff3742 100%);
        }
        
        .btn-shop {
            background: linear-gradient(135deg, #ff8a00 0%, #da1b60 100%);
        }
        
        /* Формы */
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            min-height: 120px;
            margin-bottom: 15px;
        }
        
        /* Посты */
        .posts-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        
        .post {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #667eea;
        }
        
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .post-author {
            font-weight: bold;
            color: #333;
        }
        
        .post-date {
            color: #666;
            font-size: 14px;
        }
        
        .post-content {
            line-height: 1.6;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }
        
        /* Магазин */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .shop-item {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        
        .shop-item:hover {
            border-color: #667eea;
            transform: translateY(-5px);
        }
        
        .item-emoji {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .item-price {
            color: #ff8c00;
            font-weight: bold;
            font-size: 18px;
            margin: 10px 0;
        }
        
        .item-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        /* Инвентарь */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .inventory-item {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .inventory-item:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }
        
        .inventory-emoji {
            font-size: 36px;
            margin-bottom: 8px;
        }
        
        .inventory-name {
            font-size: 14px;
            color: #333;
        }
        
        /* Подарки */
        .gifts-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .gift-item {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #00b09b;
        }
        
        .gift-emoji {
            font-size: 24px;
            margin-right: 10px;
        }
        
        /* Модальное окно */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        /* Уведомления */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        .success { background: #00b09b; }
        .error { background: #ff4757; }
        .info { background: #667eea; }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Загрузчик */
        .loader {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .shop-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Боковая панель -->
        <div class="sidebar">
            <div class="panel">
                <div class="logo">🎁 Блог с подарками</div>
                <div id="authSection"></div>
            </div>
            
            <div class="panel" id="userPanel" style="display: none;">
                <div class="user-header">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div>
                        <h3 id="userName"></h3>
                        <span class="user-badge" id="userRoleBadge">Пользователь</span>
                    </div>
                </div>
                <div class="balance">
                    <span>💎 Кванты:</span>
                    <span id="userQuanta">0</span>
                </div>
                <div class="balance" style="background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);">
                    <span>🎁 Подарки:</span>
                    <span id="userInventoryCount">0</span>
                </div>
                <button class="btn btn-danger" onclick="logout()" style="width: 100%; margin-top: 15px;">
                    Выйти
                </button>
            </div>
            
            <div class="panel" id="navigation" style="display: none;">
                <ul class="nav-list">
                    <li><button class="nav-btn active" data-section="feed">📰 Лента</button></li>
                    <li><button class="nav-btn" data-section="create">✏️ Новый пост</button></li>
                    <li><button class="nav-btn" data-section="shop">🛒 Магазин</button></li>
                    <li><button class="nav-btn" data-section="inventory">🎒 Инвентарь</button></li>
                    <li><button class="nav-btn" data-section="gifts">🎁 Мои подарки</button></li>
                    <li><button class="nav-btn" data-section="profile">👤 Профиль</button></li>
                    <li><button class="nav-btn" data-section="admin" id="adminBtn" style="display: none;">👑 Админка</button></li>
                </ul>
            </div>
        </div>
        
        <!-- Основной контент -->
        <div class="main-content">
            <div class="content-section active" id="feedSection">
                <h2>📰 Лента постов</h2>
                <div id="feedContent"></div>
            </div>
            
            <div class="content-section" id="createSection">
                <h2>✏️ Новый пост</h2>
                <div id="createContent"></div>
            </div>
            
            <div class="content-section" id="shopSection">
                <h2>🛒 Магазин подарков</h2>
                <div id="shopContent"></div>
            </div>
            
            <div class="content-section" id="inventorySection">
                <h2>🎒 Мой инвентарь</h2>
                <div id="inventoryContent"></div>
            </div>
            
            <div class="content-section" id="giftsSection">
                <h2>🎁 Мои подарки</h2>
                <div id="giftsContent"></div>
            </div>
            
            <div class="content-section" id="profileSection">
                <h2>👤 Мой профиль</h2>
                <div id="profileContent"></div>
            </div>
            
            <div class="content-section" id="adminSection">
                <h2>👑 Админ-панель</h2>
                <div id="adminContent"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/blog';
        let currentUser = null;
        let shopItems = [];
        let selectedGift = null;
        
        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });
        
        // ========== АУТЕНТИФИКАЦИЯ ==========
        async function checkAuth() {
            const token = localStorage.getItem('blog_token');
            const user = localStorage.getItem('blog_user');
            
            if (token && user) {
                try {
                    currentUser = JSON.parse(user);
                    showUserPanel();
                    showNavigation();
                    loadFeed();
                } catch (e) {
                    logout();
                }
            } else {
                showLoginForm();
            }
        }
        
        function showLoginForm() {
            document.getElementById('authSection').innerHTML = `
                <div class="auth-form">
                    <input type="text" id="username" placeholder="Имя пользователя" required>
                    <input type="password" id="password" placeholder="Пароль" required>
                    <button class="btn" onclick="login()">Войти</button>
                    <button class="btn" onclick="showRegisterForm()" style="margin-top: 10px;">
                        Регистрация
                    </button>
                </div>
            `;
            
            showSection('feed');
            document.getElementById('feedContent').innerHTML = `
                <p style="text-align: center; color: #666; padding: 40px;">
                    Войдите или зарегистрируйтесь, чтобы начать пользоваться блогом
                </p>
            `;
        }
        
        function showRegisterForm() {
            document.getElementById('authSection').innerHTML = `
                <div class="auth-form">
                    <input type="text" id="regUsername" placeholder="Имя пользователя" required>
                    <input type="password" id="regPassword" placeholder="Пароль" required>
                    <input type="password" id="regConfirm" placeholder="Повторите пароль" required>
                    <button class="btn btn-success" onclick="register()">Зарегистрироваться</button>
                    <button class="btn" onclick="showLoginForm()" style="margin-top: 10px;">Назад</button>
                </div>
            `;
        }
        
        async function login() {
            const username = document.getElementById('username')?.value.trim();
            const password = document.getElementById('password')?.value;
            
            if (!username || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Ошибка входа');
                }
                
                localStorage.setItem('blog_token', data.token);
                localStorage.setItem('blog_user', JSON.stringify(data.user));
                
                currentUser = data.user;
                showUserPanel();
                showNavigation();
                loadFeed();
                
                showMessage('Успешный вход!', 'success');
                
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }
        
        async function register() {
            const username = document.getElementById('regUsername')?.value.trim();
            const password = document.getElementById('regPassword')?.value;
            const confirm = document.getElementById('regConfirm')?.value;
            
            if (!username || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }
            
            if (password !== confirm) {
                showMessage('Пароли не совпадают', 'error');
                return;
            }
            
            if (password.length < 4) {
                showMessage('Пароль должен быть минимум 4 символа', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Ошибка регистрации');
                }
                
                showMessage(data.message || 'Регистрация успешна!', 'success');
                showLoginForm();
                
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }
        
        function showUserPanel() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('userPanel').style.display = 'block';
            document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userRoleBadge').textContent = currentUser.role === 'admin' ? '👑 Админ' : '👤 Пользователь';
            document.getElementById('userRoleBadge').className = `user-badge ${currentUser.role === 'admin' ? 'admin' : ''}`;
            document.getElementById('userQuanta').textContent = currentUser.quanta;
            document.getElementById('userInventoryCount').textContent = currentUser.inventoryCount || 0;
        }
        
        function showNavigation() {
            document.getElementById('navigation').style.display = 'block';
            
            if (currentUser.role === 'admin') {
                document.getElementById('adminBtn').style.display = 'block';
            }
            
            // Навигация
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    const section = this.dataset.section;
                    showSection(section);
                });
            });
        }
        
        function logout() {
            localStorage.removeItem('blog_token');
            localStorage.removeItem('blog_user');
            currentUser = null;
            showLoginForm();
            document.getElementById('userPanel').style.display = 'none';
            document.getElementById('navigation').style.display = 'none';
            showMessage('Вы вышли из системы', 'info');
        }
        
        // ========== НАВИГАЦИЯ ==========
        function showSection(section) {
            // Скрыть все разделы
            document.querySelectorAll('.content-section').forEach(sec => {
                sec.classList.remove('active');
            });
            
            // Показать выбранный
            document.getElementById(`${section}Section`).classList.add('active');
            
            // Загрузить контент
            switch(section) {
                case 'feed':
                    loadFeed();
                    break;
                case 'create':
                    showCreatePost();
                    break;
                case 'shop':
                    loadShop();
                    break;
                case 'inventory':
                    loadInventory();
                    break;
                case 'gifts':
                    loadGifts();
                    break;
                case 'profile':
                    loadProfile();
                    break;
                case 'admin':
                    loadAdminPanel();
                    break;
            }
        }
        
        // ========== ЛЕНТА ==========
        async function loadFeed() {
            document.getElementById('feedContent').innerHTML = '<div class="loader">Загрузка постов...</div>';
            
            try {
                const token = localStorage.getItem('blog_token');
                const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
                
                const response = await fetch(API_URL, { headers });
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Ошибка загрузки');
                }
                
                const posts = data.posts || [];
                
                if (posts.length === 0) {
                    document.getElementById('feedContent').innerHTML = `
                        <p style="text-align: center; color: #666; padding: 40px;">
                            Пока нет постов. Будьте первым!
                        </p>
                    `;
                    return;
                }
                
                document.getElementById('feedContent').innerHTML = `
                    <div class="posts-grid">
                        ${posts.map(post => `
                            <div class="post">
                                <div class="post-header">
                                    <div>
                                        <div class="post-author">${post.authorName}</div>
                                        <div class="post-date">${formatDate(post.createdAt)}</div>
                                    </div>
                                    ${post.canDelete ? `
                                        <button class="btn btn-danger" onclick="deletePost('${post.id}')">
                                            Удалить
                                        </button>
                                    ` : ''}
                                </div>
                                <div class="post-content">${escapeHtml(post.content)}</div>
                                <div style="color: #00b09b; font-size: 14px; margin-top: 10px;">
                                    💎 +5 квантов за пост
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
            } catch (error) {
                document.getElementById('feedContent').innerHTML = `
                    <p style="text-align: center; color: #666; padding: 40px;">
                        ${error.message || 'Ошибка загрузки ленты'}
                    </p>
                `;
            }
        }
        
        // ========== СОЗДАНИЕ ПОСТА ==========
        function showCreatePost() {
            document.getElementById('createContent').innerHTML = `
                <div style="margin-top: 20px;">
                    <textarea id="postContent" placeholder="Что у вас нового?..." required></textarea>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="color: #666;">
                            <small>За пост вы получите <strong>5 квантов</strong></small>
                        </div>
                        <button class="btn btn-success" onclick="createPost()">
                            Опубликовать
                        </button>
                    </div>
                </div>
            `;
        }
        
        async function createPost() {
            const content = document.getElementById('postContent')?.value.trim();
            
            if (!content) {
                showMessage('Напишите что-нибудь', 'error');
                return;
            }
            
            try {
                const token = localStorage.getItem('blog_token');
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Ошибка публикации');
                }
                
                showMessage(data.message || 'Пост опубликован!', 'success');
                document.getElementById('postContent').value = '';
                
                // Обновляем баланс
                currentUser.quanta += data.quantaEarned || 5;
                document.getElementById('userQuanta').textContent = currentUser.quanta;
                
                // Возвращаемся в ленту
                document.querySelector('.nav-btn[data-section="feed"]').click();
                
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }
        
        async function deletePost(id) {
            if (!confirm('Удалить этот пост?')) return;
            
            try {
                const token = localStorage.getItem('blog_token');
                const response = await fetch(`${API_URL}?id=${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Ошибка удаления');
                }
                
                showMessage(data.message || 'Пост удалён', 'success');
                loadFeed();
                
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }
        
        // ========== МАГАЗИН ==========
        async function loadShop() {
            document.getElementById('shopContent').innerHTML = '<div class="loader">Загрузка магазина...</div>';
            
            try {
                const response = await fetch(`${API_URL}/shop`);
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Ошибка загрузки магазина');
                }
                
                shopItems = data.shop.items || [];
                
                document.getElementById('shopContent').innerHTML = `
                    <div style="margin-bottom: 20px; color: #666;">
                        Ваш баланс: <strong>${currentUser.quanta} квантов</strong>
                    </div>
                    <div class="shop-grid">
                        ${shopItems.map(item => `
                            <div class="shop-item">
                                <div class="item-emoji">${item.emoji}</div>
                                <h3>${item.name}</h3>
                                <div class="item-price">💎 ${item.price} квантов</div>
                                <div class="item-description">${item.description}</div>
                                <button class="btn ${currentUser.quanta >= item.price ? 'btn-success' : 'btn-danger'}" 
                                        onclick="buyItem('${item.id}')"
                                        ${currentUser.quanta < item.price ? 'disabled' : ''}>
                                    Купить
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
                
            } catch (error) {
                document.getElementById('shopContent').innerHTML = `
                    <p style="text-align: center; color: #666; padding: 40px;">
                        ${error.message || 'Ошибка загрузки магазина'}
                    </p>
                `;
            }
        }
        
        async function buyItem(itemId) {
            if (!confirm('Купить этот предмет?')) return;
            
            try {
                const token = localStorage.getItem('blog_token');
                const response = await fetch(`${API_URL}/shop/buy`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ itemId })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Ошибка покупки');
                }
                
                showMessage(data.message || 'Покупка успешна!', 'success');
                
                // Обновляем данные пользователя
                currentUser.quanta = data.newBalance;
                currentUser.inventoryCount = (currentUser.inventoryCount || 0) + 1;
                
                document.getElementById('userQuanta').textContent = currentUser.quanta;
                document.getElementById('userInventoryCount').textContent = currentUser.inventoryCount;
                
                // Обновляем магазин
                loadShop();
                
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }
        
        // ========== ИНВЕНТАРЬ ==========
        async function loadInventory() {
            document.getElementById('inventoryContent').innerHTML = '<div class="loader">Загрузка инвентаря...</div>';
            
            try {
                const token = localStorage.getItem('blog_token');
                const response = await fetch(`${API_URL}/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Ошибка загрузки');
                }
                
                const inventory = data.user.inventory || [];
                
                if (inventory.length === 0) {
                    document.getElementById('inventoryContent').innerHTML = `
                        <p style="text-align: center; color: #666; padding: 40px;">
                            Ваш инвентарь пуст. Купите что-нибудь в магазине!
                        </p>
                    `;
                    return;
                }
                
                document.getElementById('inventoryContent').innerHTML = `
                    <p style="color: #666; margin-bottom: 20px;">
                        Нажмите на предмет, чтобы отправить его в подарок
                    </p>
                    <div class="inventory-grid">
                        ${inventory.map(item => `
                            <div class="inventory-item" onclick="selectGift('${item.id}', '${item.emoji}', '${item.name}')">
                                <div class="inventory-emoji">${item.emoji}</div>
                                <div class="inventory-name">${item.name}</div>
                                ${item.price ? `<div style="color: #ff8c00; font-size: 12px; margin-top: 5px;">💎 ${item.price}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                    
                    ${selectedGift ? `
                    <div style="margin-top: 30px; padding: 20px; background: #f8f9ff; border-radius: 10px;">
                        <h3>Отправить подарок</h3>
                        <p>Выбран: ${selectedGift.emoji} ${selectedGift.name}</p>
                        
                        <div style="margin: 15px 0;">
                            <input type="text" id="searchUser" placeholder="Найти пользователя..." 
                                   style="width: 100%; padding: 10px; margin-bottom: 10px;"
                                   oninput="searchUsers(this.value)">
                            <div id="searchResults" style="max-height: 200px; overflow-y: auto;"></div>
                        </div>
                        
                        <div style="margin: 15px 0;">
                            <input type="text" id="giftMessage" placeholder="Сообщение (необязательно)" 
                                   style="width: 100%; padding: 10px;">
                        </div>
                        
                        <button class="btn btn-success" onclick="sendGift()" style="width: 100%;">
                            Отправить подарок
                        </button>
                    </div>
                    ` : ''}
                `;
                
            } catch (error) {
                document.getElementById('inventoryContent').innerHTML = `
                    <p style="text-align: center; color: #666; padding: 40px;">
                        ${error.message || 'Ошибка загрузки инвентаря'}
                    </p>
                `;
            }
        }
        
        function selectGift(id, emoji, name) {
            selectedGift = { id, emoji, name };
            loadInventory();
        }
        
        async function searchUsers(query) {
            if (!query || query.length < 2) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }
            
            try {
                const token = localStorage.getItem('blog_token');
                const response = await fetch(`${API_URL}/users/search?q=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    return;
                }
                
                const users = data.users || [];
                
                document.getElementById('searchResults').innerHTML = `
                    ${users.map(user => `
                        <div style="padding: 10px; border-bottom: 1px solid #eee; cursor: pointer;" 
                             onclick="selectUser('${user.id}', '${user.username}')">
                            <strong>${user.username}</strong>
                            <div style="color: #666; font-size: 12px;">${user.role === 'admin' ? '👑 Админ' : '👤 Пользователь'}</div>
                        </div>
                    `).join('')}
                `;
                
            } catch (error) {
                console.error('Ошибка поиска:', error);
            }
        }
        
        let selectedUser = null;
        
        function selectUser(id, username) {
            selectedUser = { id, username };
            document.getElementById('searchUser').value = username;
            document.getElementById('searchResults').innerHTML = '';
        }
        
        async function sendGift() {
            if (!selectedGift || !selectedUser) {
                showMessage('Выберите подарок и получателя', 'error');
                return;
            }
            
            if (!confirm(`Отправить ${selectedGift.emoji} пользователю ${selectedUser.username}?`)) {
                return;
            }
            
            try {
                const token = localStorage.getItem('blog_token');
                const message = document.getElementById('giftMessage')?.value || '';
                
                const response = await fetch(`${API_URL}/gifts/send`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        receiverId: selectedUser.id,
                        giftId: selectedGift.id,
                        message: message
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Ошибка отправки');
                }
                
                showMessage(data.message || 'Подарок отправлен!', 'success');
                
                // Сброс
                selectedGift = null;
                selectedUser = null;
                loadInventory();
                
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }
        
        // ========== ПОДАРКИ ==========
        async function loadGifts() {
            document.getElementById('giftsContent').innerHTML = '<div class="loader">Загрузка подарков...</div>';
            
            try {
                const token = localStorage.getItem('blog_token');
                const response = await fetch(`${API_URL}/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Ошибка загрузки');
                }
                
                const user = data.user;
                const received = user.giftsReceived || [];
                const sent = user.giftsSent || [];
                
                document.getElementById('giftsContent').innerHTML = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div>
                            <h3>🎁 Полученные подарки (${received.length})</h3>
                            ${received.length > 0 ? `
                                <div class="gifts-list">
                                    ${received.map(gift => `
                                        <div class="gift-item">
                                            <div style="display: flex; align-items: center; margin-bottom: 10px;">
                                                <span class="gift-emoji">${gift.emoji}</span>
                                                <div>
                                                    <div><strong>${gift.name}</strong></div>
                                                    <div style="color: #666; font-size: 14px;">от ${gift.fromUsername}</div>
                                                </div>
                                            </div>
                                            ${gift.message ? `<div style="color: #333; font-style: italic;">"${gift.message}"</div>` : ''}
                                            <div style="color: #666; font-size: 12px; margin-top: 5px;">
                                                ${formatDate(gift.sentAt)}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : '<p style="color: #666; text-align: center; padding: 20px;">Пока нет полученных подарков</p>'}
                        </div>
                        
                        <div>
                            <h3>📤 Отправленные подарки (${sent.length})</h3>
                            ${sent.length > 0 ? `
                                <div class="gifts-list">
                                    ${sent.map(gift => `
                                        <div class="gift-item">
                                            <div style="display: flex; align-items: center; margin-bottom: 10px;">
                                                <span class="gift-emoji">${gift.emoji}</span>
                                                <div>
                                                    <div><strong>${gift.name}</strong></div>
                                                    <div style="color: #666; font-size: 14px;">для ${gift.toUsername}</div>
                                                </div>
                                            </div>
                                            ${gift.message ? `<div style="color: #333; font-style: italic;">"${gift.message}"</div>` : ''}
                                            <div style="color: #666; font-size: 12px; margin-top: 5px;">
                                                ${formatDate(gift.sentAt)}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : '<p style="color: #666; text-align: center; padding: 20px;">Пока нет отправленных подарков</p>'}
                        </div>
                    </div>
                `;
                
            } catch (error) {
                document.getElementById('giftsContent').innerHTML = `
                    <p style="text-align: center; color: #666; padding: 40px;">
                        ${error.message || 'Ошибка загрузки подарков'}
                    </p>
                `;
            }
        }
        
        // ========== ПРОФИЛЬ ==========
        async function loadProfile() {
            document.getElementById('profileContent').innerHTML = '<div class="loader">Загрузка профиля...</div>';
            
            try {
                const token = localStorage.getItem('blog_token');
                const response = await fetch(`${API_URL}/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Ошибка загрузки');
                }
                
                const user = data.user;
                const transactions = data.recentTransactions || [];
                
                document.getElementById('profileContent').innerHTML = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div>
                            <div style="background: #f8f9ff; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                                <h3 style="margin-bottom: 15px;">👤 Информация</h3>
                                <p><strong>Имя:</strong> ${user.username}</p>
                                <p><strong>Роль:</strong> ${user.role === 'admin' ? '👑 Администратор' : '👤 Пользователь'}</p>
                                <p><strong>Кванты:</strong> <span style="color: #ff8c00; font-weight: bold;">💎 ${user.quanta}</span></p>
                                <p><strong>Постов:</strong> ${user.postCount || 0}</p>
                                <p><strong>Подарков в инвентаре:</strong> ${user.inventory?.length || 0}</p>
                                <p><strong>Зарегистрирован:</strong> ${formatDate(user.createdAt)}</p>
                            </div>
                        </div>
                        
                        <div>
                            <div style="background: #f8f9ff; padding: 20px; border-radius: 10px;">
                                <h3 style="margin-bottom: 15px;">💰 История операций</h3>
                                ${transactions.length > 0 ? `
                                    <div style="max-height: 300px; overflow-y: auto;">
                                        ${transactions.map(t => `
                                            <div style="padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between;">
                                                <div>
                                                    <div>${t.reason}</div>
                                                    <small style="color: #666;">${formatDate(t.timestamp)}</small>
                                                </div>
                                                <div style="color: ${t.amount > 0 ? '#00b09b' : '#ff4757'}; font-weight: bold;">
                                                    ${t.amount > 0 ? '+' : ''}${t.amount} квантов
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : '<p style="color: #666; text-align: center; padding: 20px;">Нет операций</p>'}
                            </div>
                        </div>
                    </div>
                `;
                
            } catch (error) {
                document.getElementById('profileContent').innerHTML = `
                    <p style="text-align: center; color: #666; padding: 40px;">
                        ${error.message || 'Ошибка загрузки профиля'}
                    </p>
                `;
            }
        }
        
        // ========== АДМИНКА ==========
        async function loadAdminPanel() {
            if (!currentUser || currentUser.role !== 'admin') {
                document.getElementById('adminContent').innerHTML = '<p style="color: #666;">Требуются права администратора</p>';
                return;
            }
            
            document.getElementById('adminContent').innerHTML = '<div class="loader">Загрузка админ-панели...</div>';
            
            try {
                const token = localStorage.getItem('blog_token');
                
                const [statsResponse, usersResponse] = await Promise.all([
                    fetch(`${API_URL}/admin/stats`, { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch(`${API_URL}/admin/users`, { headers: { 'Authorization': `Bearer ${token}` } })
                ]);
                
                const statsData = await statsResponse.json();
                const usersData = await usersResponse.json();
                
                if (!statsData.success || !usersData.success) {
                    throw new Error('Ошибка загрузки данных');
                }
                
                const stats = statsData.stats;
                const users = usersData.users;
                
                document.getElementById('adminContent').innerHTML = `
                    <div style="margin-bottom: 20px;">
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                            <div style="background: #f8f9ff; padding: 20px; border-radius: 10px; text-align: center;">
                                <div style="font-size: 24px; font-weight: bold; color: #667eea;">${stats.totalUsers}</div>
                                <div style="color: #666;">Пользователей</div>
                            </div>
                            <div style="background: #f8f9ff; padding: 20px; border-radius: 10px; text-align: center;">
                                <div style="font-size: 24px; font-weight: bold; color: #667eea;">${stats.totalPosts}</div>
                                <div style="color: #666;">Постов</div>
                            </div>
                            <div style="background: #f8f9ff; padding: 20px; border-radius: 10px; text-align: center;">
                                <div style="font-size: 24px; font-weight: bold; color: #ff8c00;">💎 ${stats.totalQuanta}</div>
                                <div style="color: #666;">Всего квантов</div>
                            </div>
                            <div style="background: #f8f9ff; padding: 20px; border-radius: 10px; text-align: center;">
                                <div style="font-size: 24px; font-weight: bold; color: #00b09b;">${stats.totalGifts || 0}</div>
                                <div style="color: #666;">Подарков</div>
                            </div>
                        </div>
                    </div>
                    
                    <div style="margin: 30px 0;">
                        <h3>👥 Управление пользователями</h3>
                        <div style="max-height: 400px; overflow-y: auto; margin-top: 15px;">
                            ${users.map(user => `
                                <div style="padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <div style="font-weight: bold;">${user.username}</div>
                                        <div style="color: #666; font-size: 14px;">
                                            ${user.role === 'admin' ? '👑 Админ' : '👤 Пользователь'} • 
                                            Постов: ${user.postCount} • 
                                            💎 ${user.quanta}
                                        </div>
                                    </div>
                                    <button class="btn" onclick="addQuantaToUser('${user.id}', '${user.username}')">
                                        Добавить кванты
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
            } catch (error) {
                document.getElementById('adminContent').innerHTML = `
                    <p style="text-align: center; color: #666; padding: 40px;">
                        ${error.message || 'Ошибка загрузки админ-панели'}
                    </p>
                `;
            }
        }
        
        function addQuantaToUser(userId, username) {
            const amount = prompt(`Сколько квантов добавить пользователю ${username}?`, '100');
            const reason = prompt('Причина начисления:', 'Бонус от администратора');
            
            if (amount && reason) {
                addQuanta(userId, parseInt(amount), reason);
            }
        }
        
        async function addQuanta(userId, amount, reason) {
            try {
                const token = localStorage.getItem('blog_token');
                const response = await fetch(`${API_URL}/admin/add-quanta`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId, amount, reason })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Ошибка');
                }
                
                showMessage(`Добавлено ${amount} квантов пользователю`, 'success');
                loadAdminPanel();
                
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }
        
        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
        function formatDate(dateString) {
            try {
                const date = new Date(dateString);
                return date.toLocaleString('ru-RU', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return 'неизвестно';
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }
        
        function showMessage(text, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = text;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
